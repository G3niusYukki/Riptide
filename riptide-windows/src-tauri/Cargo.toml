[package]
name = "riptide-windows"
version = "2.5.0"
description = "Riptide - A native Windows proxy client"
authors = ["Riptide Team"]
edition = "2021"
default-run = "riptide-windows"

[lib]
name = "riptide_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5", features = [] }

[dependencies]
tauri = { version = "=2.10", features = ["tray-icon", "test"] }
# `test` feature unlocks `tauri::test::mock_builder()` /
# `mock_context()` / `noop_assets()` for the C8.5 IPC integration
# test. The feature is gated to `#[cfg(test)]`-only code
# internally so release builds aren't bloated — the feature flag
# just lets the same `tauri::test` symbols resolve from
# integration tests' own compile scope.
tauri-plugin-shell = "=2.3.5"
tauri-plugin-process = "=2.3.1"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-opener = "=2.5.3"
tauri-plugin-updater = "=2.10.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-log = "0.2"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"
tokio-tungstenite = "0.26"
futures = "0.3"
which = "7"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
boa_engine = "0.17"
base64 = "0.22"

# WARP / WireGuard keypair
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"

# Global hotkey support
global-hotkey = "0.6"

tauri-plugin-fs = "=2.5.0"
tauri-plugin-single-instance = "=2.4.2"
tauri-plugin-deep-link = "=2.4.9"

[target.'cfg(windows)'.dependencies]
sysproxy = "0.3"
windows-service = "0.7"
winapi = { version = "0.3", features = [
    "wininet",
    "minwindef",
    "handleapi",
    "processthreadsapi",
    "securitybaseapi",
    "shellapi",
    "synchapi",
    "winbase",
    "winnt",
    "dpapi",
    "wincrypt",
] }

# ── Linux platform dependencies ──────────────────────────────────

[target.'cfg(target_os = "linux")'.dependencies]
tokio-tun = "0.12"

[profile.release]
strip = true
lto = true
opt-level = 3
