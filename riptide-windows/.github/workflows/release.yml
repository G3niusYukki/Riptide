# riptide-windows Release
# Phase B / B2.2 — runs on tag push of the form vX.Y.Z.
#
# Pipeline:
#   1. matrix: windows-latest x [x64, arm64]
#   2. setup-node 20 + rust stable (>= 1.75) + rust-cache
#   3. npm ci
#   4. npm run tauri build
#   5. collect .msi + .exe (NSIS) artifacts
#   6. softprops/action-gh-release@v2 uploads them to the GitHub Release
#
# Target wall time per arch: < 25 min on windows-latest.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag version to publish (e.g. v2.4.2) — must match an existing tag'
        required: true
        default: ''

# Releases are serialized: never run two at once on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }} (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            arch_label: x64
          - target: aarch64-pc-windows-msvc
            rust_target: aarch64-pc-windows-msvc
            arch_label: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: riptide-windows/package-lock.json

      - name: Install Rust stable (>= 1.75)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: riptide-windows/src-tauri
          shared-key: riptide-windows-release-${{ matrix.arch_label }}

      - name: Show toolchain versions
        shell: pwsh
        run: |
          node --version
          npm --version
          cargo --version
          rustc --version

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref }}" -replace "refs/tags/", ""
          } elseif ("${{ github.event.inputs.version }}" -ne "") {
            $tag = "${{ github.event.inputs.version }}"
          } else {
            Write-Error "No version could be determined (ref=${{ github.ref }})."
            exit 1
          }
          if ($tag -notmatch '^v?\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' does not match vX.Y.Z pattern."
            exit 1
          }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: npm ci
        working-directory: riptide-windows
        run: npm ci

      - name: Build (npm run tauri build — both NSIS + MSI)
        working-directory: riptide-windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: List build output
        working-directory: riptide-windows/src-tauri/target/release/bundle
        shell: pwsh
        run: |
          Write-Host "--- NSIS ---"
          Get-ChildItem -Recurse -Path nsis -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host "--- MSI ---"
          Get-ChildItem -Recurse -Path msi -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Upload .msi + .exe to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: riptide-windows-${{ matrix.arch_label }}-${{ steps.version.outputs.version }}
          path: |
            riptide-windows/src-tauri/target/release/bundle/msi/*.msi
            riptide-windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.ref }}" != "" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: riptide-windows-x64-${{ steps.version.outputs.version }}
          path: dist/x64

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: riptide-windows-arm64-${{ steps.version.outputs.version }}
          path: dist/arm64

      - name: Flatten into a single dist/ tree
        run: |
          mkdir -p dist
          find dist/x64 -type f -exec cp {} dist/ \;
          find dist/arm64 -type f -exec cp {} dist/ \;
          echo "Release files:"
          ls -la dist/

      - name: Compute SHA-256 checksums
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Riptide ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.msi
            dist/*.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
