name: Engine Benchmark (Windows Rust)

# C6 deliverable: dedicated workflow for the Rust-side
# EngineBenchmark harness. Kept separate from ci.yml so the
# benchmark artifact retention policy can be tuned independently
# of the per-PR test signal, and so a regression in the harness
# does not block PRs (the bench workflow is `workflow_dispatch` +
# monthly schedule only — never a required PR check).

on:
  schedule:
    # 1st of each month, 04:00 UTC (mirror of the macOS Swift
    # bench.yml cadence so cross-platform trends line up).
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Iterations per dimension (clamped to [1, 1024])'
        required: false
        default: '10'

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./riptide-windows/src-tauri
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js (Tauri runtime dep)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./riptide-windows/src-tauri
          shared-key: riptide-windows-bench-cargo

      - name: Cargo test (harness self-tests)
        # Runs the 2 new tests added by C6: the JSON-shape
        # round-trip in bench::report::tests and the
        # graceful-when-mihomo-missing check in
        # bench::harness::tests. Fails the workflow if the
        # harness contract drifts.
        run: cargo test --lib bench

      - name: Build a synthetic benchmark report
        # Even without a real mihomo binary on the runner, the
        # harness returns Ok with a Skipped-dimensions report.
        # We write that report to disk so it lands in the
        # artifact. A follow-up phase can wire a real mihomo
        # bootstrap before this step to capture live numbers.
        shell: bash
        run: |
          cat > /tmp/write_bench_report.rs <<'EOF'
          // Standalone smoke — we do not link the lib here
          // (CI does not run the Tauri app). Instead we emit a
          // minimal JSON artifact that matches the
          // BenchmarkReport shape so the artifact uploader
          // has something deterministic to ship. The actual
          // harness output is captured by `cargo test --lib
          // bench` in the previous step.
          EOF
          mkdir -p bench-output
          cat > bench-output/bench-report.json <<'EOF'
          {
            "started_at": "2026-06-07T00:00:00Z",
            "finished_at": "2026-06-07T00:00:00Z",
            "platform": "windows",
            "engine": "mihomo",
            "engine_binary": null,
            "dimensions": [
              {
                "name": "http_connect_p50",
                "status": "skipped",
                "iterations": 0,
                "samples": [],
                "summary": {
                  "p50_ms": null,
                  "p99_ms": null,
                  "mean_ms": 0.0,
                  "min_ms": 0.0,
                  "max_ms": 0.0,
                  "stddev_ms": 0.0,
                  "successful": 0,
                  "total": 0
                },
                "reason": "mihomo binary not found on this platform"
              },
              {
                "name": "startup",
                "status": "skipped",
                "iterations": 0,
                "samples": [],
                "summary": {
                  "p50_ms": null,
                  "p99_ms": null,
                  "mean_ms": 0.0,
                  "min_ms": 0.0,
                  "max_ms": 0.0,
                  "stddev_ms": 0.0,
                  "successful": 0,
                  "total": 0
                },
                "reason": "mihomo binary not found on this platform"
              }
            ]
          }
          EOF
          cat bench-output/bench-report.json

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-windows
          path: riptide-windows/src-tauri/bench-output/bench-report.json
          retention-days: 90
