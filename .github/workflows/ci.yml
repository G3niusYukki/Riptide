name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── macOS: Swift ──────────────────────────────────────────────

  swift-lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed Swift files
        id: changed-swift-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.swift
            Package.swift

      - name: SwiftLint
        if: steps.changed-swift-files.outputs.any_changed == 'true'
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict ${{ steps.changed-swift-files.outputs.all_changed_files }}

      - name: No Swift files changed
        if: steps.changed-swift-files.outputs.any_changed != 'true'
        run: echo 'No Swift files changed; skipping.'

  swift-build-test:
    name: Swift Build & Test
    runs-on: macos-15
    timeout-minutes: 30
    needs: swift-lint
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swift-

      - name: Disk space
        run: df -h /

      - name: Swift version
        run: swift --version

      - name: Download mihomo binary
        run: ./Scripts/download-mihomo.sh

      - name: Build
        run: swift build

      - name: Test XCTest
        run: swift test --disable-swift-testing

      - name: Test Swift Testing suites
        run: bash Scripts/ci-swift-testing-suites.sh

  # NOTE: SwiftUI UI tests live in Tests/RiptideAppUITests as a SwiftPM
  # .testTarget. The target compiles, but XCUIApplication requires
  # Xcode's UI test runner (an .xcodeproj UI test target), so
  # `swift test --filter RiptideAppUITests` will currently crash the
  # xctest process on macOS runners. We run it anyway with
  # `continue-on-error: true` to surface the limitation, capture the
  # failure logs as an artifact, and prove the wiring end-to-end.
  # Remove `continue-on-error` once Riptide migrates to an
  # .xcodeproj (or SwiftPM UI test target) that supports XCUIApplication.
  swift-ui-test:
    name: SwiftUI UI Tests
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 45
    needs: swift-lint
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-swift-uitest-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swift-uitest-

      - name: Download mihomo binary
        run: ./Scripts/download-mihomo.sh

      - name: Run UI tests (allow retry on flake)
        run: |
          set +e
          swift test --filter "RiptideAppUITests" 2>&1 | tee uitest-output.log
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::warning::UI tests failed, retrying once"
            sleep 5
            swift test --filter "RiptideAppUITests" 2>&1 | tee uitest-output.log
            EXIT_CODE=$?
          fi
          exit $EXIT_CODE

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: uitest-results
          path: uitest-output.log

  # ── Windows: Frontend ─────────────────────────────────────────

  frontend-check:
    name: Frontend (tsc + build)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./riptide-windows
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./riptide-windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build

  # ── Windows: Rust ─────────────────────────────────────────────

  rust-check:
    name: Rust (check + test)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./riptide-windows/src-tauri
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js (for Tauri runtime dep)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./riptide-windows/src-tauri

      - name: Cargo check
        run: cargo check

      - name: Cargo test (compile only — wintun.dll required at runtime)
        run: cargo test --no-run --verbose

  # ── Linux: Rust check ─────────────────────────────────────────

  linux-check:
    name: Linux (cargo check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./riptide-windows/src-tauri
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js (for Tauri runtime dep)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./riptide-windows/src-tauri

      - name: Cargo check (Linux target)
        run: cargo check --target x86_64-unknown-linux-gnu
